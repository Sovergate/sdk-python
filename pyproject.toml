[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovergate"
dynamic = ["version"]
description = "EU AI Act compliance SDK — automatic, non-invasive audit logging for LLM calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Roberto Postolovski" }]
keywords = ["eu-ai-act", "compliance", "gdpr", "llm", "audit", "openai", "anthropic", "pii", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sovergate.com"
Repository = "https://github.com/Sovergate/sdk-python"
Issues = "https://github.com/Sovergate/sdk-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "openai>=1.0",
  "anthropic>=2.0",
  "httpx>=0.27",
  "httpx2",
]

[tool.hatch.version]
path = "sovergate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sovergate"]

[tool.hatch.build.targets.sdist]
include = ["sovergate", "tests", "README.md", "LICENSE", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
